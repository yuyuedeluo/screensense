[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screensense"
version = "0.4.0"
description = "便宜的準即時螢幕觀看：畫面有變化才拼成一張圖交給視覺模型"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "Pillow>=10"]

[project.optional-dependencies]
mss = ["mss>=9"]
dev = ["pytest>=8"]

[project.scripts]
screensense = "screensense.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
